<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smart Safe Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f4f6f9; }
    .status-value { min-height: 2rem; font-size: 1.35rem; font-weight: 600; }
    .card { border: 0; box-shadow: 0 .125rem .5rem rgba(0, 0, 0, .08); }
  </style>
</head>
<body>
  <nav class="navbar navbar-dark bg-dark">
    <div class="container">
      <span class="navbar-brand mb-0 h1">Smart Safe Dashboard</span>
      <span id="connection-state" class="badge text-bg-secondary">Menghubungkan...</span>
    </div>
  </nav>

  <main class="container py-4">
    <section class="row g-3 mb-4" aria-label="Status brankas">
      <div class="col-12 col-sm-6 col-xl-3">
        <div class="card h-100"><div class="card-body">
          <h2 class="h6 text-secondary">Status Kunci</h2>
          <div id="lock-value" class="status-value">—</div>
        </div></div>
      </div>
      <div class="col-12 col-sm-6 col-xl-3">
        <div class="card h-100"><div class="card-body">
          <h2 class="h6 text-secondary">Getaran</h2>
          <div id="vibration-value" class="status-value">—</div>
        </div></div>
      </div>
      <div class="col-12 col-sm-6 col-xl-3">
        <div class="card h-100"><div class="card-body">
          <h2 class="h6 text-secondary">Alarm</h2>
          <div id="alarm-value" class="status-value">—</div>
        </div></div>
      </div>
      <div class="col-12 col-sm-6 col-xl-3">
        <div class="card h-100"><div class="card-body">
          <h2 class="h6 text-secondary">Kesalahan PIN</h2>
          <div id="pin-errors-value" class="status-value">—</div>
        </div></div>
      </div>
    </section>

    <section class="card mb-4">
      <div class="card-body">
        <h2 class="h5 mb-3">Kontrol Brankas</h2>
        <div class="d-flex flex-wrap gap-2">
          <button type="button" class="btn btn-primary" data-action="UNLOCK">Buka Kunci</button>
          <button type="button" class="btn btn-success" data-action="LOCK">Kunci</button>
          <button type="button" class="btn btn-warning" data-action="RESET_ALARM">Reset Alarm</button>
        </div>
        <div id="control-message" class="small mt-3" role="status" aria-live="polite"></div>
      </div>
    </section>

    <section class="card">
      <div class="card-body">
        <h2 class="h5">Riwayat</h2>
        <div class="table-responsive">
          <table class="table table-striped align-middle mb-0">
            <thead><tr><th>Waktu</th><th>Peristiwa</th></tr></thead>
            <tbody id="history-body">
              <tr><td colspan="2" class="text-secondary">Belum ada peristiwa.</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <script>
    const historyBody = document.getElementById('history-body');
    let lastEvent = '';

    function showValue(id, value, fallback = '—') {
      document.getElementById(id).textContent = value ?? fallback;
    }

    function addHistory(event) {
      const row = document.createElement('tr');
      const timeCell = document.createElement('td');
      const eventCell = document.createElement('td');
      timeCell.textContent = new Date().toLocaleTimeString('id-ID');
      eventCell.textContent = event;

      if (historyBody.querySelector('td[colspan]')) historyBody.replaceChildren();
      row.append(timeCell, eventCell);
      historyBody.prepend(row);
      while (historyBody.rows.length > 10) historyBody.deleteRow(-1);
    }

    async function refreshStatus() {
      const connection = document.getElementById('connection-state');
      try {
        const response = await fetch('/api/status');
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();

        showValue('lock-value', data.lock);
        showValue('vibration-value', data.vibration);
        showValue('alarm-value', data.alarm);
        showValue('pin-errors-value', data.pin_errors ?? data.attempts, '0');
        connection.textContent = 'Terhubung';
        connection.className = 'badge text-bg-success';

        if (data.last_event && data.last_event !== lastEvent) {
          lastEvent = data.last_event;
          addHistory(data.last_event);
        }
      } catch (error) {
        connection.textContent = 'Tidak terhubung';
        connection.className = 'badge text-bg-danger';
      }
    }

    document.querySelectorAll('[data-action]').forEach((button) => {
      button.addEventListener('click', async () => {
        const message = document.getElementById('control-message');
        document.querySelectorAll('[data-action]').forEach((item) => item.disabled = true);
        message.textContent = 'Mengirim perintah...';
        message.className = 'small mt-3 text-secondary';
        try {
          const response = await fetch('/api/control', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: button.dataset.action })
          });
          const result = await response.json();
          if (!response.ok) throw new Error(result.error || `HTTP ${response.status}`);
          message.textContent = `Perintah ${result.action} berhasil dikirim.`;
          message.className = 'small mt-3 text-success';
        } catch (error) {
          message.textContent = `Gagal mengirim perintah: ${error.message}`;
          message.className = 'small mt-3 text-danger';
        } finally {
          document.querySelectorAll('[data-action]').forEach((item) => item.disabled = false);
        }
      });
    });

    refreshStatus();
    window.setInterval(refreshStatus, 2000);
  </script>
</body>
</html>
